name: CI

on:
    push:
        branches: [main]
    pull_request:

concurrency:
    group: ci-${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    check:
        name: Build, typecheck, test, lint
        runs-on: ubuntu-latest
        timeout-minutes: 20

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup Bun
              uses: oven-sh/setup-bun@v2
              with:
                  bun-version: 1.3.14

            - name: Install
              run: bun install --frozen-lockfile

            - name: Build react-foldkit (dist + eslint)
              run: bun run build --filter=react-foldkit

            - name: Typecheck
              run: bun run typecheck

            - name: Test
              run: bun run test --filter=react-foldkit

            - name: Lint
              run: bun run lint --filter=react-foldkit --filter=web

            - name: Build web (consumes package dist)
              run: bun run build --filter=web

            - name: Pack dry-run
              working-directory: packages/react-foldkit
              run: npm pack --dry-run
